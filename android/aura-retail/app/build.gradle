plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
    id 'org.jetbrains.kotlin.plugin.compose'
    id 'com.chaquo.python'
}

// aura-fullsuits root = the new source of truth. Independent of, and never reads
// from, the original AuraEnterprise repository. android/aura-retail/app -> aura-retail
// -> android -> aura-fullsuits, so two levels up from this project's dir.
// See docs/android/android-migration-plan.md.
def suiteRoot = rootProject.projectDir.parentFile.parentFile
def stagedPyOut = "${buildDir}/staged-python"      // staged backend + commercial_runtime (git-ignored)
def stagedAssetsOut = "${buildDir}/staged-assets"  // staged bundle assets (git-ignored)

// ── Signing (reads android/aura-retail/keystore.properties if present; never commit it) ──
def keystorePropsFile = rootProject.file("keystore.properties")
def keystoreProps = new Properties()
if (keystorePropsFile.exists()) {
    keystoreProps.load(new FileInputStream(keystorePropsFile))
}

android {
    namespace 'com.actionaura.retail'
    compileSdk 34

    defaultConfig {
        applicationId "com.actionaura.retail"
        minSdk 26
        targetSdk 34
        versionCode 6
        versionName "1.0.0-rc.5"

        ndk {
            // Chaquopy's Python 3.12 ships only these ABIs.
            abiFilters "arm64-v8a", "x86_64"
        }

        // Commercial-identity placeholder (Phase 4G). Real tenant_id / license key /
        // installation_id are intentionally NOT embedded at build time -- see
        // com.actionaura.retail.identity.CommercialIdentity and
        // docs/android/android-migration-plan.md.
        buildConfigField "String", "PRODUCT_CODE", "\"AURA_RETAIL\""

        // Phase 7 Part H -- Owner licensing endpoint. Empty by default: an
        // unconfigured build leaves the embedded backend's /api/licensing/*
        // routes reporting NOT_CONFIGURED (never a hidden fallback URL --
        // see products/retail/backend/config.py's identical rationale).
        // Overridden per real build via -PownerLicensingBaseUrl=... (gradle
        // property, e.g. from a CI secret or local.properties), never
        // hardcoded here.
        buildConfigField "String", "OWNER_LICENSING_BASE_URL",
                "\"${project.findProperty('ownerLicensingBaseUrl') ?: ''}\""

        // Multi-device sync foundation (2026-08-06), Task 9 wiring -- Owner's
        // sync relay root (Kotlin appends "/api/sync/v1/push|pull" itself,
        // same as SyncRelayClient.kt does), following the EXACT same
        // independently-configured, empty-by-default pattern as
        // OWNER_LICENSING_BASE_URL immediately above (never derived from it --
        // desktop's own AURA_OWNER_LICENSING_URL and AURA_SYNC_RELAY_URL are
        // two separately-set env vars pointed at the same Owner host but
        // different path depths; see products/retail/backend/config.py).
        // Overridden per real build via -PownerSyncBaseUrl=..., never
        // hardcoded here. Empty means SyncCoordinator stays inert (no timer
        // started), never a hidden default Owner instance.
        buildConfigField "String", "OWNER_SYNC_BASE_URL",
                "\"${project.findProperty('ownerSyncBaseUrl') ?: ''}\""
    }

    // ── Python (Chaquopy) ───────────────────────────────────────────────────────
    chaquopy {
        defaultConfig {
            version "3.12"
            pip {
                // Trimmed to what products/retail/backend + commercial_runtime actually
                // import (verified by import scan) -- flask-login/flask-socketio/pandas/
                // gunicorn/eventlet from the monolith's requirements.txt are unused here.
                install "Flask==3.0.3"
                install "Werkzeug==3.0.3"
                install "flask-cors==4.0.1"
                install "waitress==3.0.0"
                install "openpyxl==3.1.2"
                install "requests==2.32.3"
                // Phase 7V-F: see aura-clinic/app/build.gradle's identical
                // block for the full rationale -- commercial_runtime/
                // licensing_contracts imports `cryptography`, which was
                // never added here, crashing app.py's import chain on every
                // real device launch (found via physical-device testing).
                // No version pin -- 43.0.1 has no Chaquopy pre-built wheel
                // for this Python/ABI combo (falls back to a source build
                // needing a Rust cross-compiler, unavailable here). Chaquopy
                // resolves this to whichever version it has a real
                // pre-built wheel for (42.0.8 as of this build).
                install "cryptography"
            }
        }
    }

    // Staged backend is added as an extra Python source root (Chaquopy reads
    // android.sourceSets.*.python), so `import app`, `import commercial_runtime...`
    // resolve the same way products/retail/desktop/launcher_retail.py does.
    // main.py / android_platform.py stay in the default src/main/python.
    sourceSets {
        getByName("main") {
            python { srcDir stagedPyOut }
            assets.srcDir stagedAssetsOut
        }
    }

    // ── Build types ──────────────────────────────────────────────────────────────
    // Wave 1B fix: must come before buildTypes -- Groovy evaluates this
    // closure top to bottom, and buildTypes below references
    // signingConfigs.release. This was masked until now because
    // keystore.properties never existed, so the `if (keystorePropsFile.exists())`
    // guard always short-circuited before the broken reference was reached.
    signingConfigs {
        release {
            if (keystorePropsFile.exists()) {
                storeFile rootProject.file(keystoreProps['storeFile'])
                storePassword keystoreProps['storePassword']
                keyAlias keystoreProps['keyAlias']
                keyPassword keystoreProps['keyPassword']
            }
        }
    }

    buildTypes {
        debug {
            applicationIdSuffix ".debug"
            debuggable true
            buildConfigField "String", "BUILD_ENV", "\"debug\""
        }
        // Internal pre-release channel: release-shaped (non-debuggable) but signed
        // with a separate/no key -- for install-and-verify testing only, never shipped.
        staging {
            initWith debug
            applicationIdSuffix ".staging"
            debuggable false
            matchingFallbacks = ['debug']
            buildConfigField "String", "BUILD_ENV", "\"staging\""
            // initWith(debug) also copies debug's signingConfig (the auto-generated
            // Android debug key) -- override it so staging matches release's signing
            // behavior (production key if present, else genuinely unsigned) instead
            // of silently shipping debug-signed builds.
            signingConfig null
            if (keystorePropsFile.exists()) {
                signingConfig signingConfigs.release
            }
        }
        release {
            minifyEnabled false   // Chaquopy; keep simple for first releases
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            buildConfigField "String", "BUILD_ENV", "\"release\""
            if (keystorePropsFile.exists()) {
                signingConfig signingConfigs.release
            }
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    kotlinOptions {
        jvmTarget = '17'
    }
    buildFeatures {
        compose true
        buildConfig true
    }
}

dependencies {
    implementation 'androidx.core:core-ktx:1.13.1'
    implementation 'androidx.appcompat:appcompat:1.7.0'

    // ── Jetpack Compose (native UI) ──────────────────────────────────────────
    def composeBom = platform('androidx.compose:compose-bom:2024.09.03')
    implementation composeBom
    implementation 'androidx.activity:activity-compose:1.9.3'
    implementation 'androidx.compose.ui:ui'
    implementation 'androidx.compose.ui:ui-graphics'
    implementation 'androidx.compose.material3:material3'
    implementation 'androidx.compose.material:material-icons-extended'
    implementation 'androidx.navigation:navigation-compose:2.8.3'
    implementation 'androidx.lifecycle:lifecycle-runtime-compose:2.8.6'
    implementation 'androidx.lifecycle:lifecycle-viewmodel-compose:2.8.6'

    // ── Networking to the embedded local Flask server ────────────────────────
    implementation 'com.squareup.retrofit2:retrofit:2.11.0'
    implementation 'com.squareup.retrofit2:converter-gson:2.11.0'
    implementation 'com.squareup.okhttp3:okhttp:4.12.0'
    implementation 'org.jetbrains.kotlinx:kotlinx-coroutines-android:1.8.1'
    // Declared directly (not just relied on transitively via converter-gson
    // above) because com.actionaura.retail.licensing.DeviceIdentity imports
    // com.google.gson.Gson directly -- a real pure-JVM JSON library, unlike
    // org.json.JSONObject, which is an Android-platform-stubbed class whose
    // methods throw "not mocked" under plain JUnit. Same fix as Clinic's
    // build.gradle -- see
    // docs/licensing/phase7/android-device-key-storage-design.md.
    implementation 'com.google.code.gson:gson:2.11.0'

    implementation 'io.coil-kt:coil-compose:2.7.0'

    // ── Barcode scanning (phone camera) ──────────────────────────────────────
    def camerax = '1.3.4'
    implementation "androidx.camera:camera-core:$camerax"
    implementation "androidx.camera:camera-camera2:$camerax"
    implementation "androidx.camera:camera-lifecycle:$camerax"
    implementation "androidx.camera:camera-view:$camerax"
    implementation 'com.google.mlkit:barcode-scanning:17.3.0'

    // ── Phase 7 licensing: Ed25519 device identity ────────────────────────────
    // Mirrors Clinic's identical addition -- see that build.gradle's comment
    // and docs/licensing/phase7/android-device-key-storage-design.md
    // (ADR-7.1) for the full rationale.
    implementation 'com.google.crypto.tink:tink-android:1.15.0'

    // ── Unit/contract tests (JVM, no device/emulator needed) ─────────────────
    testImplementation 'junit:junit:4.13.2'
    // gson is already on the test classpath via the `implementation` entry
    // above -- no separate testImplementation needed.
    testImplementation 'com.google.truth:truth:1.4.4'
    // Real local HTTP server for OwnerClientTest -- mirrors Clinic's identical addition.
    testImplementation 'com.squareup.okhttp3:mockwebserver:4.12.0'
    // SyncRelayClientTest: generates real self-signed certs (HeldCertificate/
    // HandshakeCertificates) to run MockWebServer over actual TLS and prove
    // SyncRelayClient's raw-socket pull() path does real hostname
    // verification -- same version as the okhttp/mockwebserver above.
    testImplementation 'com.squareup.okhttp3:okhttp-tls:4.12.0'

    constraints {
        implementation('org.jetbrains.kotlin:kotlin-stdlib-jdk7:2.0.21')
        implementation('org.jetbrains.kotlin:kotlin-stdlib-jdk8:2.0.21')
    }
}

// ─────────────────────────────────────────────────────────────────────────────
//  Staging tasks — assemble the backend + web assets from aura-fullsuits/products
//  and aura-fullsuits/commercial_runtime. The original AuraEnterprise repo is never
//  referenced (Phase 4Q independence requirement).
// ─────────────────────────────────────────────────────────────────────────────

tasks.register('stageAuraPython', Copy) {
    description "Copy products/retail/backend + commercial_runtime from aura-fullsuits."
    doFirst { delete stagedPyOut }
    into stagedPyOut
    from("${suiteRoot}/products/retail/backend") {
        into 'products/retail/backend'
        exclude '**/__pycache__/**', '**/*.pyc'
    }
    from("${suiteRoot}/commercial_runtime") {
        into 'commercial_runtime'
        exclude '**/__pycache__/**', '**/*.pyc'
    }
}

tasks.register('stageAuraAssets', Copy) {
    description "Stage the bundle assets extracted by AssetInstaller.java on first run."
    def dest = "${stagedAssetsOut}/bundle"
    doFirst { delete stagedAssetsOut }
    into dest
    from("${suiteRoot}/products/retail/frontend")
}

// Wire staging into the build graph with EXPLICIT task dependencies (Gradle fails
// the build if a task consumes another task's output dir without declaring it).
tasks.matching { it.name.startsWith('merge') && it.name.endsWith('PythonSources') }
        .configureEach { dependsOn 'stageAuraPython' }

afterEvaluate {
    tasks.named('preBuild').configure { dependsOn 'stageAuraPython', 'stageAuraAssets' }
    android.applicationVariants.all { variant ->
        tasks.named("merge${variant.name.capitalize()}Assets").configure {
            dependsOn 'stageAuraAssets'
        }
    }
}
