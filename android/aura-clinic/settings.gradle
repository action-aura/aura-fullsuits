pluginManagement {
    repositories {
        google()
        mavenCentral()
        gradlePluginPortal()
        maven { url "https://chaquo.com/maven" }
    }
}
dependencyResolutionManagement {
    repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
    repositories {
        google()
        mavenCentral()
        maven { url "https://chaquo.com/maven" }
    }
}

// Standalone Aura Clinic app. Independent Gradle project (own applicationId,
// own package namespace) -- not a flavor of a shared multi-product build.
// See docs/android/android-migration-plan.md.
rootProject.name = "AuraClinic"
include ':app'
