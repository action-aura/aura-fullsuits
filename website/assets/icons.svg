    <path d="M20 12a8 8 0 0 1-13.6 5.7L4 16" />
    <polyline points="16.5 4 20 8 15.5 8.6" />
    <polyline points="7.5 20 4 16 8.5 15.4" />
  </symbol>
  <symbol id="icon-barcode" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round">
    <path d="M3 5v14M7 5v14M10 5v14M13 5v14M17 5v14M21 5v14" />
  </symbol>
  <symbol id="icon-printer" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
