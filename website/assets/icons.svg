<svg xmlns="http://www.w3.org/2000/svg" style="display:none">
  <!--
    Hand-built icon set for the Aura Retail marketing site.
    2px round-stroke, monochrome, currentColor: matching the product's
    own AuraIcons language (DESIGN.md section 7) without importing that
    file (it is written for the app shell's render() resolver, not a
    static site). 24x24 viewBox, stroke-based, no fills except where noted.

    NOTE ON XML WELL-FORMEDNESS: this file is fetched as a standalone
    document by every <use href="assets/icons.svg#id"> reference across
    the site, so it must parse as strict XML, not merely as permissive
    HTML. Two hyphens in a row anywhere inside this comment (even in
    prose) breaks that parse silently in Chromium: every icon on every
    page renders as an empty box with no console error at all. Use a
    single hyphen or a colon in this comment block, never a double one.
  -->
  <symbol id="icon-wifi-off" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
    <path d="M2 8.5c2.2-2 5-3.2 8-3.4M22 8.5a17 17 0 0 0-5.3-3.1M5.5 12.5a11 11 0 0 1 4-2.1M18.5 12.5a11 11 0 0 0-2.7-1.9M9 16.3a5.8 5.8 0 0 1 3-1M12 20h.01" />
    <line x1="2.5" y1="2.5" x2="21.5" y2="21.5" />
  </symbol>
  <symbol id="icon-ledger" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
    <rect x="3.5" y="3.5" width="17" height="17" rx="2" />
    <line x1="3.5" y1="9" x2="20.5" y2="9" />
    <line x1="3.5" y1="14.5" x2="20.5" y2="14.5" />
    <line x1="9" y1="9" x2="9" y2="20.5" />
  </symbol>
  <symbol id="icon-sync" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
