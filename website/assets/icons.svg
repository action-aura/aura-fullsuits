    <rect x="3.5" y="8.5" width="17" height="8" rx="1.5" />
    <path d="M6.5 14.5h11v6h-11z" />
  </symbol>
  <symbol id="icon-drawer" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
