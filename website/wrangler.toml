# Cloudflare Pages project for actionaura.me. The D1 database id is filled in
# Plan 3 from the real Cloudflare account; until then local dev uses
# `wrangler pages dev` with a local D1.
name = "action-aura-website"
pages_build_output_dir = "dist"
compatibility_date = "2026-09-01"

[[d1_databases]]
binding = "DB"
database_name = "aura-leads"
database_id = "SET-IN-PLAN-3"
migrations_dir = "migrations"
