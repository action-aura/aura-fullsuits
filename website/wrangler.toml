# Cloudflare Pages project for actionaura.me. This file is the source of truth for
# bindings and non-secret vars (the dashboard cannot override them). Secrets
# (TURNSTILE_SECRET, IP_SALT, SMTP_PASS) are set with `wrangler pages secret put`.
name = "action-aura-website"
pages_build_output_dir = "dist"
compatibility_date = "2026-09-01"

[[d1_databases]]
binding = "DB"
database_name = "aura-leads"
database_id = "c2000ae7-21cc-4b66-813f-f9e6aec23efe"
migrations_dir = "migrations"

# Non-secret runtime settings. Lead alerts go by SMTP through the Namecheap Private Email
# mailbox; SMTP_PASS is a Pages secret set by the owner in the dashboard (2026-10-19).
[vars]
NOTIFY_PROVIDER = "smtp"
SMTP_HOST = "mail.privateemail.com"
SMTP_PORT = "465"
SMTP_USER = "info@actionaura.me"
NOTIFY_TO = "info@actionaura.me"
