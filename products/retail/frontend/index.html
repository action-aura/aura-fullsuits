<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Aura Retail</title>
  <link rel="icon" href="data:,">
  <script>
    // OPERATIONAL CALM: two sanctioned themes, and this boot line VALIDATES the
    // saved choice instead of trusting it. Runs before main.css so first paint
    // is already in the right theme (no flash).
    //
    // HISTORY -- read before "simplifying" this. The first dark theme was
    // killed here for cause: the compatibility layer in main.css was scoped to
    // [data-theme="light"] while dark was white literals injected from JS, so a
    // document carrying data-theme="dark" rendered .ret-table white-on-white at
    // 1.00:1 -- and because the choice was PERSISTED under 'aura_theme', any
    // terminal where anyone had ever tapped the toggle booted straight into
    // that on upgrade day. For a while this line therefore FORCED light.
    //
    // Dark v2 (owner request, 2026-09) is token-value-only -- see the
    // html[data-theme="dark"] block in main.css for why the old failure mode is
    // no longer expressible -- so a persisted choice is safe to honour again,
    // under three guards that make the upgrade path safe BY VALUE, not by hope:
    //
    //   1. A NEW KEY. 'aura_theme_v2' has never held a value written by the
    //      broken era, so nothing stale can be misread as a choice.
    //   2. EXACT-MATCH VALIDATION. Only the exact string 'dark' produces dark.
    //      Any other value -- absent, corrupt, or a leftover the old accent
    //      picker's vocabulary ('midnight', 'carbon', ...) could ever leak in --
    //      resolves to light, the base palette.
    //   3. THE OLD KEY STAYS BANISHED. 'aura_theme' is still REMOVED, never
    //      read: a dark preference from the broken era must not resurrect
    //      itself; the user re-opts-in once through the picker, deliberately.
    //
    // retail_design_theme_safety_test.js pins all three guards by name.
    try {
      var savedTheme = null;
      try { savedTheme = localStorage.getItem('aura_theme_v2'); } catch (e) {}
      document.documentElement.setAttribute('data-theme',
        savedTheme === 'dark' ? 'dark' : 'light');
      localStorage.removeItem('aura_theme');
    } catch(e) {}
    // This build only ever serves Retail — the shell skips the multi-subsystem
    // chooser entirely and launches straight into it (see app-shell.js).
    window.IS_STANDALONE = true;
  </script>
  <link rel="stylesheet" href="/static/css/main.css">
  <link rel="stylesheet" href="/static/css/rtl.css">
  <style>
    /* OPERATIONAL CALM: this rule used to set a hardcoded near-black page
       background with plain white body text, under a document that defaults to
       data-theme="light" (see the boot script above). Two things were wrong
       with it, and both were visible on every install:
         * it is a LITERAL, so the theme tokens could not reach the page's own
           background at all — main.css themes .sub-content and the panels, but
           the root surface behind them stayed near-black regardless of theme,
           which is what produced the dark seam around a light UI;
         * white body text on a light theme is the worst possible default for
           any text that inherits from body rather than from a themed class.
       Both now come from the same tokens every panel uses, so the working
       surface follows the theme instead of fighting it. */
    html, body { margin: 0; padding: 0; inline-size: 100%; block-size: 100%; }
    body { background: var(--app-bg); color: var(--text); }
  </style>
</head>
<body>
  <div id="app">
    <div id="page-subsystem" class="page active" style="height:100vh;">
      <div id="subsystem-shell" style="height:100%; display:flex;"></div>
    </div>
  </div>

  <script src="/static/icons.js"></script>
  <script src="/static/i18n.js"></script>
  <script src="/static/import-wizard.js"></script>
  <script src="/static/lib/chart.umd.min.js"></script>
  <script src="/static/subsystem-retail.js"></script>
  <script src="/static/sub-ai.js"></script>
  <script src="/static/cash-drawer.js"></script>
  <!-- Employee management (multi-device Phase 1). After subsystem-retail.js
       because it delegates its HTTP + escaping helpers to RetailSystem, and
       before app-shell.js, which is what boots the shell and can navigate
       straight into the section. -->
  <script src="/static/employees.js"></script>
  <script src="/static/app-shell.js"></script>
  <script>
    AuraI18n.load().then(() => SubsystemApp.init());
  </script>
</body>
</html>
