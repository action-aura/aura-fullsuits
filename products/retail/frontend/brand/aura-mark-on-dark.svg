<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" role="img" aria-labelledby="t">
  <title id="t">Aura Retail mark, dark ground</title>
  <!-- BRAND KIT v2 (2026-09-20). Content here is identical to the
       new-in-this-kit aura-retail-dark.svg; this filename is kept,
       unrenamed, so nothing that already references
       "aura-mark-on-dark.svg" 404s (retail_brand_ring_contrast_test.js
       reads this exact path).

       THIS REPLACES A DERIVED VALUE WITH A DELIVERED ONE. The 2026-09-19
       revision of this file did not have a dark-ground Retail trio from the
       owner, only a dark-ground brightening of the MASTER teal mark; it
       applied that brightening RATIO to Retail's own accent colours as a
       stand-in (fr end-stop #1E3A5A, rb start-stop #223B5E -- both pulled
       from the v1 kit's own dark master, not from any Retail-specific
       source). v2 delivers the real thing: Retail's own dark-ground trio,
       with the shadow facet at the guide's now-official "Lifted navy"
       #22304A ("shadow facet on dark surfaces, so the letter doesn't
       sink"), replacing the old #223B5E stand-in. -->
  <defs>
    <linearGradient id="fl" x1="0%" y1="0%" x2="0%" y2="100%"><stop offset="0%" stop-color="#F0B87A"/><stop offset="100%" stop-color="#C97B3D"/></linearGradient>
    <linearGradient id="fr" x1="0%" y1="0%" x2="0%" y2="100%"><stop offset="0%" stop-color="#A06030"/><stop offset="100%" stop-color="#22304A"/></linearGradient>
    <linearGradient id="rb" x1="0%" y1="0%" x2="100%" y2="0%"><stop offset="0%" stop-color="#22304A"/><stop offset="100%" stop-color="#C97B3D"/></linearGradient>
    <linearGradient id="rf" x1="0%" y1="0%" x2="100%" y2="0%"><stop offset="0%" stop-color="#C97B3D"/><stop offset="100%" stop-color="#F0B87A"/></linearGradient>
  </defs>
  <path d="M 24 69 A 36 8 0 0 1 96 69" transform="rotate(-12 60 69)" fill="none" stroke="url(#rb)" stroke-width="5" opacity="0.6"/>
  <path d="M60 12.6 L60 56 L40 104 L22 104 Z" fill="url(#fl)"/>
  <path d="M60 12.6 L98 104 L80 104 L60 56 Z" fill="url(#fr)"/>
  <line x1="60" y1="12.6" x2="60" y2="56" stroke="#FBE3C4" stroke-width="1.3" opacity="0.95"/>
  <rect x="55.5" y="81.5" width="9" height="9" rx="2" fill="#F0B87A"/>
  <path d="M 24 69 A 36 8 0 0 0 96 69" transform="rotate(-12 60 69)" fill="none" stroke="url(#rf)" stroke-width="6" stroke-linecap="round"/>
  <circle cx="95.2" cy="61.5" r="7.5" fill="#F0B87A" opacity="0.3"/>
  <circle cx="95.2" cy="61.5" r="4" fill="#FBE3C4"/>
</svg>
