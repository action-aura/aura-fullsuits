<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="256" height="256" role="img" aria-labelledby="t d">
  <title id="t">Aura mark, dark ground</title>
  <desc id="d">The Aura ring and spark around a light A, for dark surfaces and the app icon.</desc>
  <defs>
    <linearGradient id="aura-ring-d" x1="0.15" y1="0.9" x2="0.85" y2="0.1">
