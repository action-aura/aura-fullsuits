<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" role="img" aria-labelledby="t">
  <title id="t">Aura Retail mark</title>
  <!-- BRAND KIT v2 (2026-09-20). The Retail product's own 3D mark, LIGHT
       ground: same pierced-A construction as aura-mark-light.svg, wearing
       Retail's accent trio (dark #A06030 / mid #C97B3D / light #F0B87A)
       instead of the master teal, plus Retail's counter glyph -- the small
       SQUARE ("the module on the shelf") sitting in the counter where the
       ring shows through. The right (shadow) facet fades to the shared
       brand navy #16233D -- that constant is what makes every product's
       mark read as a sibling of the others (see Action-Aura-Brand-Guide.md,
       "Family rule"). Content here is identical to the new-in-this-kit
       aura-retail-light.svg; this filename is kept, unrenamed, so nothing
       that already references "aura-retail.svg" 404s (icons.js's
       AuraIcons.mark() names this file as the source it reproduces inline
       for sizes >= 64px). For the dark-ground pairing see
       aura-retail-dark.svg. -->
  <defs>
    <linearGradient id="fl" x1="0%" y1="0%" x2="0%" y2="100%"><stop offset="0%" stop-color="#F0B87A"/><stop offset="100%" stop-color="#C97B3D"/></linearGradient>
    <linearGradient id="fr" x1="0%" y1="0%" x2="0%" y2="100%"><stop offset="0%" stop-color="#A06030"/><stop offset="100%" stop-color="#16233D"/></linearGradient>
    <linearGradient id="rb" x1="0%" y1="0%" x2="100%" y2="0%"><stop offset="0%" stop-color="#16233D"/><stop offset="100%" stop-color="#C97B3D"/></linearGradient>
    <linearGradient id="rf" x1="0%" y1="0%" x2="100%" y2="0%"><stop offset="0%" stop-color="#C97B3D"/><stop offset="100%" stop-color="#F0B87A"/></linearGradient>
  </defs>
  <path d="M 24 69 A 36 8 0 0 1 96 69" transform="rotate(-12 60 69)" fill="none" stroke="url(#rb)" stroke-width="5" opacity="0.55"/>
  <path d="M60 12.6 L60 56 L40 104 L22 104 Z" fill="url(#fl)"/>
  <path d="M60 12.6 L98 104 L80 104 L60 56 Z" fill="url(#fr)"/>
  <line x1="60" y1="12.6" x2="60" y2="56" stroke="#FBE3C4" stroke-width="1.3" opacity="0.95"/>
  <rect x="55.5" y="81.5" width="9" height="9" rx="2" fill="#C97B3D"/>
  <path d="M 24 69 A 36 8 0 0 0 96 69" transform="rotate(-12 60 69)" fill="none" stroke="url(#rf)" stroke-width="6" stroke-linecap="round"/>
  <circle cx="95.2" cy="61.5" r="7.5" fill="#F0B87A" opacity="0.3"/>
  <circle cx="95.2" cy="61.5" r="4" fill="#FBE3C4"/>
</svg>
