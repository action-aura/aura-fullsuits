<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" role="img" aria-labelledby="t">
  <title id="t">Aura mark, flat</title>
  <!-- BRAND KIT v2 (2026-09-20). Master/generic flat mark (teal ring) for
       <=64px use (favicons, stamps, embroidery, single-colour print) on a
       LIGHT ground: navy letterform + one teal ring stroke, no gradients,
       no 3D shading -- per Action-Aura-Brand-Guide.md, the 3D facet/gradient
       versions must NOT be used below 64px. This is the same geometry and
       colour this directory already carried under aura-mark-flat.svg
       (kept, unrenamed, so nothing already referencing that filename
       404s); this -light-suffixed copy exists to sit alongside the new
       aura-mark-flat-dark.svg as a matched pair, per the v2 kit's own file
       list. The Retail product's own flat export (navy + Retail accent
       ring, no teal) is aura-mark-1bit.svg / AuraIcons.mark()'s flat branch
       in ../icons.js. -->
  <path d="M60 12.6 L98 104 L80 104 L60 56 L40 104 L22 104 Z" fill="#16233D"/>
  <path d="M 24 69 A 36 8 0 0 0 96 69" transform="rotate(-12 60 69)" fill="none" stroke="#2F7B7B" stroke-width="9" stroke-linecap="round"/>
