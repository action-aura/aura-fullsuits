<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-labelledby="t">
  <title id="t">Aura Retail app icon</title>
  <!-- 2026-09-19: REDESIGNED to the new pierced-A Retail mark -- see
       aura-mark.svg's header comment for the full context. Same
       512x512/rx=112 rounded-square navy ground as before; the mark inside
       is the dark-ground Retail 3D mark (aura-mark-on-dark.svg's palette,
       inlined here rather than referenced, same as the previous generation
       did) scaled from its native 0-120 viewBox to fill most of the icon.
       Consumed live by the browser tab favicon (index.html, customer-
       display.html both link this file directly) as well as any future
       OS/launcher icon use -- unlike AuraIcons.mark(), this file is not
       split into a separate <64px flat variant, since an app/launcher icon
       is drawn at many sizes by the OS and a favicon crop of the 3D
       version already matches what this file looked like before. -->
  <defs>
    <linearGradient id="icon-ground" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0e1a33"/>
      <stop offset="1" stop-color="#070b12"/>
    </linearGradient>
    <radialGradient id="icon-glow" cx="0.72" cy="0.22" r="0.6">
      <stop offset="0" stop-color="#F0B87A" stop-opacity="0.24"/>
      <stop offset="1" stop-color="#F0B87A" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="ic-fl" x1="0%" y1="0%" x2="0%" y2="100%"><stop offset="0%" stop-color="#F6CFA0"/><stop offset="100%" stop-color="#DB9A57"/></linearGradient>
    <linearGradient id="ic-fr" x1="0%" y1="0%" x2="0%" y2="100%"><stop offset="0%" stop-color="#B87A45"/><stop offset="100%" stop-color="#1E3A5A"/></linearGradient>
    <linearGradient id="ic-rb" x1="0%" y1="0%" x2="100%" y2="0%"><stop offset="0%" stop-color="#223B5E"/><stop offset="100%" stop-color="#DB9A57"/></linearGradient>
    <linearGradient id="ic-rf" x1="0%" y1="0%" x2="100%" y2="0%"><stop offset="0%" stop-color="#DB9A57"/><stop offset="100%" stop-color="#F6CFA0"/></linearGradient>
  </defs>
  <rect width="512" height="512" rx="112" fill="url(#icon-ground)"/>
  <rect width="512" height="512" rx="112" fill="url(#icon-glow)"/>
  <g transform="translate(256 256) scale(3.625) translate(-60 -60)">
    <path d="M 24 69 A 36 8 0 0 1 96 69" transform="rotate(-12 60 69)" fill="none" stroke="url(#ic-rb)" stroke-width="5" opacity="0.6"/>
    <path d="M60 12.6 L60 56 L40 104 L22 104 Z" fill="url(#ic-fl)"/>
    <path d="M60 12.6 L98 104 L80 104 L60 56 Z" fill="url(#ic-fr)"/>
    <line x1="60" y1="12.6" x2="60" y2="56" stroke="#FDF0E0" stroke-width="1.3" opacity="0.95"/>
    <rect x="55.5" y="81.5" width="9" height="9" rx="2" fill="#DB9A57"/>
    <path d="M 24 69 A 36 8 0 0 0 96 69" transform="rotate(-12 60 69)" fill="none" stroke="url(#ic-rf)" stroke-width="6" stroke-linecap="round"/>
    <circle cx="95.2" cy="61.5" r="7.5" fill="#F6CFA0" opacity="0.3"/>
    <circle cx="95.2" cy="61.5" r="4" fill="#FDF6EC"/>
  </g>
</svg>
