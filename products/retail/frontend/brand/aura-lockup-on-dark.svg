    <path d="M60 12.6 L60 56 L40 104 L22 104 Z" fill="url(#lkd-fl)"/>
    <path d="M60 12.6 L98 104 L80 104 L60 56 Z" fill="url(#lkd-fr)"/>
    <line x1="60" y1="12.6" x2="60" y2="56" stroke="#FDF0E0" stroke-width="1.3" opacity="0.95"/>
    <rect x="55.5" y="81.5" width="9" height="9" rx="2" fill="#DB9A57"/>
    <path d="M 24 69 A 36 8 0 0 0 96 69" transform="rotate(-12 60 69)" fill="none" stroke="url(#lkd-rf)" stroke-width="6" stroke-linecap="round"/>
    <circle cx="95.2" cy="61.5" r="7.5" fill="#F6CFA0" opacity="0.3"/>
    <circle cx="95.2" cy="61.5" r="4" fill="#FDF6EC"/>
