<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 200" width="640" height="200" role="img" aria-labelledby="t d">
  <title id="t">Aura Retail lockup, dark ground</title>
  <desc id="d">The Aura Retail mark beside the AURA wordmark with RETAIL beneath it, for dark surfaces. The wordmark is outlined (Outfit 700 and 300), so no font is needed to render it.</desc>
  <!-- 2026-09-19: REDESIGNED, paired with aura-lockup.svg -- see that
       file's header comment for the full context (same wordmark paths,
       unchanged; same scripts/brand/lockup_to_paths.py drift gap). Mark
       uses the dark-ground Retail palette (aura-mark-on-dark.svg); AURA in
       Ivory #F6F4EF (was off-white #EDF2F8), RETAIL in Retail's LIGHT
       accent #F0B87A for contrast against a dark ground (was the master
       teal #5FE3D0). -->
  <defs>
    <linearGradient id="lkd-fl" x1="0%" y1="0%" x2="0%" y2="100%"><stop offset="0%" stop-color="#F6CFA0"/><stop offset="100%" stop-color="#DB9A57"/></linearGradient>
    <linearGradient id="lkd-fr" x1="0%" y1="0%" x2="0%" y2="100%"><stop offset="0%" stop-color="#B87A45"/><stop offset="100%" stop-color="#1E3A5A"/></linearGradient>
    <linearGradient id="lkd-rb" x1="0%" y1="0%" x2="100%" y2="0%"><stop offset="0%" stop-color="#223B5E"/><stop offset="100%" stop-color="#DB9A57"/></linearGradient>
    <linearGradient id="lkd-rf" x1="0%" y1="0%" x2="100%" y2="0%"><stop offset="0%" stop-color="#DB9A57"/><stop offset="100%" stop-color="#F6CFA0"/></linearGradient>
  </defs>
