<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" role="img" aria-labelledby="t">
  <title id="t">Aura mark</title>
  <!-- Master Action Aura mark ("pierced A") for LIGHT backgrounds. Source of
       truth: Action-Aura-Brand-Guide.md. A faceted letter A read through the
       Greek delta, pierced by a tilted orbit ring -- the ring passes BEHIND
       the letter's shoulders (the back-arc below), shows THROUGH the counter
       (the triangular window at the ridge), and sweeps ACROSS THE FRONT of
       the legs (the front-arc), ending in a bright energy node. This is the
       master/generic Action Aura identity (teal accent) -- for the Retail
       product's own accent + square counter glyph see aura-retail.svg /
       aura-mark.svg in this same directory. -->
  <defs>
    <linearGradient id="fl" x1="0%" y1="0%" x2="0%" y2="100%"><stop offset="0%" stop-color="#6FC0BC"/><stop offset="100%" stop-color="#2F7B7B"/></linearGradient>
    <linearGradient id="fr" x1="0%" y1="0%" x2="0%" y2="100%"><stop offset="0%" stop-color="#2F6B75"/><stop offset="100%" stop-color="#16233D"/></linearGradient>
    <linearGradient id="rb" x1="0%" y1="0%" x2="100%" y2="0%"><stop offset="0%" stop-color="#16233D"/><stop offset="100%" stop-color="#2F7B7B"/></linearGradient>
    <linearGradient id="rf" x1="0%" y1="0%" x2="100%" y2="0%"><stop offset="0%" stop-color="#2F7B7B"/><stop offset="100%" stop-color="#8FD0D0"/></linearGradient>
  </defs>
  <path d="M 24 69 A 36 8 0 0 1 96 69" transform="rotate(-12 60 69)" fill="none" stroke="url(#rb)" stroke-width="5" opacity="0.55"/>
  <path d="M60 12.6 L60 56 L40 104 L22 104 Z" fill="url(#fl)"/>
  <path d="M60 12.6 L98 104 L80 104 L60 56 Z" fill="url(#fr)"/>
  <line x1="60" y1="12.6" x2="60" y2="56" stroke="#A8E0DC" stroke-width="1.3" opacity="0.9"/>
  <path d="M 24 69 A 36 8 0 0 0 96 69" transform="rotate(-12 60 69)" fill="none" stroke="url(#rf)" stroke-width="6" stroke-linecap="round"/>
  <circle cx="95.2" cy="61.5" r="7.5" fill="#8FD0D0" opacity="0.3"/>
  <circle cx="95.2" cy="61.5" r="4" fill="#D7F2F0"/>
</svg>
