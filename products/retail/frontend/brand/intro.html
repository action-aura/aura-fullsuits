<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Aura</title>
<style>
  /* BUNDLED, NOT FETCHED. This file used to pull Outfit from
     fonts.googleapis.com with a <link> in the head -- the only place in
     the whole retail frontend that reached the network for a typeface.
     Three things were wrong with that, and the first is the one that
     matters: this is an OFFLINE-FIRST till. A fresh first-run install,
     which is exactly when this intro plays, is the machine least likely
     to have internet configured -- so the brand intro, the first thing
     anyone ever sees of this product, silently rendered in Segoe UI.
     Second, Outfit is not a brand face at all: Action-Aura-Brand-Guide.md
     names Space Grotesk for wordmarks and the tagline, and main.css had
     already deleted its own 'Outfit' @font-face alias as 'an identity
     that drifted rather than one that was designed' -- that sweep
     recorded 'zero references in any .html or .js', which was true of
     the alias and missed this file's independent CDN copy. Third, every
     first run announced the install to a third party before the
     shopkeeper had typed anything.

     ONE VARIABLE FILE, not the three static per-weight woff2 the
     neighbouring pjs-*.woff2 use: this file asks for three different
     weights (700 wordmark, 300 product name and strap). Instanced as
     three statics that came to 121 KB; the variable face carries the
     whole 300..700 axis in 26 KB behind one @font-face (the first build
     of it was 68 KB because it was written as a raw TTF under a .woff2
     name -- it loaded anyway, which is why retail_offline_font_test.js
     now checks the magic number rather than the extension). The static
     neighbours exist because they were instanced out of a Latin+Arabic
     MERGE, which does not apply here.

     RELATIVE URL, deliberately, where main.css uses '/static/fonts/'.
     The shell mounts this file in an iframe at /static/brand/intro.html,
     where both forms resolve -- but this file is also opened DIRECTLY
     off disk to review the motion, and an absolute /static/ path is a
     dead link under file://. Relative works in both. Guarded by
     retail_offline_font_test.js, which resolves every local @font-face
     src against the filesystem: a renamed or uncommitted woff2 does not
     raise an error, it silently falls back, which is the same invisible
     failure as the CDN being unreachable. */
  @font-face {
    font-family: 'Space Grotesk';
    font-style: normal;
    font-weight: 300 700;
    font-display: swap;
    src: url('../fonts/grotesk-var.woff2') format('woff2-variations');
  }
  /* Aura intro -- one scene, about 4.3s of motion inside app-shell.js's
     ~6.5s overlay window (~1.2s under reduced motion), self-contained.
     REDESIGNED 2026-09-19 for the "pierced A" mark (Action-Aura-Brand-
     Guide.md): a faceted letter A read through the Greek delta, pierced by
     a tilted orbit ring. Geometry (viewBox 0 0 120 120) is copied verbatim
     from ../aura-retail.svg -- the canonical Retail 3D mark -- so this is a
     genuine reproduction of the master construction, not an approximation.

     WHY A REVEAL, NOT A COLOUR SWAP: the retired mark was a single stroked
     centre-line path, so stroke-dasharray/dashoffset could "draw" it. The
     new mark is built from two FILLED facet triangles plus a tilted
     elliptical ring stroke -- a fill has no dasharray to animate, so the
     letterform is revealed with an SVG clip-path wipe (a <rect> inside a
     userSpaceOnUse <clipPath>, scaled via CSS transform/fill-box) instead.
     The two ring arcs (back-arc and front-arc) ARE genuine stroked paths,
     so THOSE still draw on with stroke-dashoffset (pathLength="1" is used
     so the dash math is 0..1 regardless of the arc's real length).

     REVEAL ORDER intentionally follows the brand guide's own construction
     narrative, in the SAME z-order the master SVG already draws in:
       1. ring BACK-arc draws first, fully visible (nothing occludes it yet)
       2. the letterform wipes in top-down (apex first, per the guide's
          "apex overshoots the cap line" framing) and, as it grows over the
          back-arc, progressively swallows it -- except through the open
          triangular COUNTER, which is simply the unfilled gap between the
          two facets. The arc being "visible through the counter" is not a
          separate animation step; it is what z-order + the counter's shape
          produce automatically once the facets are in front of it. That is
          the same trick the master SVG's own layer order performs; this
          reveal just plays it out over time instead of rendering it static.
       3. the ring FRONT-arc draws last, on top of the finished letterform --
          the "sweeps across the front of the legs" line, literally.
       4. the energy node lights up right where the front-arc's sweep ends,
          because that end point IS the node's position (95.2, 61.5) --
          "ending in a bright energy node."
     This traces the mark's own construction story rather than a generic
     fade-in, which is the brief's ask; a plain crossfade would not show WHY
     the ring reads as "behind the shoulders" versus "across the front".

     COLOUR: every literal below is one of the five sanctioned tokens --
     navy #16233D, Retail's accent trio #A06030/#C97B3D/#F0B87A, ivory
     #F6F4EF. No teal/blue/aqua survives from the retired palette. Two
     substitutions from the master SVG's own literals, both staying inside
     that same five-colour set: the ridge highlight and node core use ivory
     #F6F4EF in place of the master's off-palette tint #FBE3C4, and the
     aurora glow uses the accent trio at low alpha instead of teal/blue.

     Reduced motion: every animation is suppressed and every element is set
     to its finished state directly (ring arcs fully drawn, facets fully
     wiped in and opaque, node lit, wordmark settled) -- see the
     `prefers-reduced-motion` block, which is the same contract the retired
     version used, just re-targeted at the new element classes. */
  :root {
    /* The brand guide's own dark FIELD (line 42, "#101A30 on #0E1729";
       line 12 calls dark surfaces the primary presentation context).
       This was #16233D, which the SAME guide defines at line 38 as the
       shadow facet for LIGHT surfaces -- a facet colour used as a
       ground. Drawing the dark-surface facet (#22304A) on it left the
       A's right leg at 1.18:1, near-invisible, because the two are
       neighbours in one family by construction. On this field the same
       facet measures 1.35:1, and every other element improves too:
       ivory 14.24 -> 16.28, "RETAIL" 4.76 -> 5.44, strap 7.96 -> 8.82.
       Low by intent, not by accident -- a shadow facet that cleared 3:1
       against its own page would stop reading as shadow; it reads by
       its 4.02:1 against the lit facet beside it. */
    --ground: #0E1729;
    /* One entrance curve for everything that arrives, so the sequence
       reads as one hand. Expo-out: fast commit, long settle. */
    --ease-entry: cubic-bezier(.16, 1, .3, 1);
    --ink: #F6F4EF;
    --accent-dark: #A06030;
    --accent-mid: #C97B3D;
    --accent-light: #F0B87A;
    --t-ring-back: 700ms;
    --t-facets: 650ms;
    --t-ring-front: 550ms;
    --t-node: 400ms;
  }
  html, body { height: 100%; margin: 0; background: var(--ground); color: var(--ink);
    font-family: 'Space Grotesk', "Segoe UI", system-ui, sans-serif; overflow: hidden; }
  .stage { position: relative; height: 100%; display: grid; place-items: center; }
  .aurora {
    position: absolute; inset: -20%; pointer-events: none;
    background:
      radial-gradient(60% 45% at 68% 30%, rgba(201, 123, 61, 0.20), transparent 70%),
      radial-gradient(55% 50% at 30% 72%, rgba(160, 96, 48, 0.22), transparent 70%);
    filter: blur(40px);
    opacity: 0;
    animation: aurora-in 2400ms 200ms cubic-bezier(.2,.7,.2,1) forwards, aurora-drift 14s 2600ms ease-in-out infinite alternate;
  }
  /* Static, unanimated depth. A soft key light behind the lockup and a
     vignette at the edges: the lockup sits IN the frame instead of on a
     flat field. Costs one paint, never composites again. */
  .depth {
    position: absolute; inset: 0; pointer-events: none;
    background:
      radial-gradient(52% 52% at 50% 45%, rgba(246, 244, 239, 0.055), transparent 70%),
      radial-gradient(125% 115% at 50% 50%, transparent 52%, rgba(0, 0, 0, 0.45) 100%);
  }
  .grain {
    position: absolute; inset: 0; pointer-events: none; opacity: .06; mix-blend-mode: overlay;
    background-image: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='160' height='160'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='.9' numOctaves='2' stitchTiles='stitch'/></filter><rect width='100%' height='100%' filter='url(%23n)'/></svg>");
  }
  /* THE LAST 2.2 SECONDS. Motion finished at 4.3s inside the shell's
     ~6.5s overlay, leaving a frozen frame for the final third -- which is
     exactly when a brand intro stops reading as film and starts reading as
     a page that has hung. A 1.5% scale over 3.2s is below the threshold of
     "an animation" and above the threshold of "alive". */
  .lockup { position: relative; display: grid; grid-template-columns: auto auto; align-items: center; gap: 44px;
    animation: settle 3400ms 3200ms ease-out forwards; }
  .mark { width: clamp(140px, 24vw, 220px); height: auto; }

  /* Ring arcs: genuine stroked paths -- pathLength="1" normalises the dash
     math to 0..1 regardless of the arc's real geometric length. */
  .ring-back, .ring-front { stroke-dasharray: 1; stroke-dashoffset: 1; }
  .ring-back { animation: ring-draw var(--t-ring-back) 300ms cubic-bezier(.4,0,.2,1) forwards; }
  .ring-front { animation: ring-draw var(--t-ring-front) 1450ms cubic-bezier(.4,0,.2,1) forwards; }

  /* Letterform: filled facets cannot be stroke-drawn, so a clip-path wipe
     (the .wipe rect, scaled from its own top edge) stands in for the
     "draw-on" the old stroked A used. .facets carries a matching opacity
     fade so the wipe edge reads as a soft materialise rather than a hard
     mechanical mask line. transform-origin is given as an explicit
     coordinate in the mark's own 0..120 user space (the rect's own top-
     centre, x=60 y=0) rather than `transform-box: fill-box` -- measured
     via getComputedStyle + a pixel scan, `fill-box` combined with an
     `opacity`/`transform` CSS animation on an SVG shape painted a stray,
     fully-opaque ghost of the (still delay-phase, computed-opacity-0)
     energy node for a few frames after load in this app's Chromium target,
     even though computed style already reported opacity 0 -- a paint/
     style desync, not anything-CSS-visible-wrong. Explicit user-space
     coordinates need no bounding-box computation at all and the ghost
     paint did not reproduce once every fill-box use below was replaced
     with one. */
  .wipe { transform: scaleY(0); transform-origin: 60px 0px;
    animation: facet-wipe var(--t-facets) 850ms cubic-bezier(.4,0,.2,1) forwards; }
  .facets { opacity: 0; animation: facets-fade var(--t-facets) 850ms ease-out forwards; }

  /* Energy node: halo rests at 30% opacity (matching the master SVG's own
     halo alpha, not full-strength), core rests fully opaque. transform-
     origin is the node's own (cx, cy) -- see the .wipe comment above for
     why this is a coordinate, not `fill-box`. */
  .node-halo { opacity: 0; transform: scale(.3); transform-origin: 95.2px 61.5px;
    animation: halo-in var(--t-node) 1900ms cubic-bezier(.2,.9,.3,1.4) forwards; }
  .node-core { opacity: 0; transform: scale(.3); transform-origin: 95.2px 61.5px;
    animation: core-in var(--t-node) 1900ms cubic-bezier(.2,.9,.3,1.4) forwards; }

  /* SPECULAR PASS. The mark is built as two lit planes and a shadow
     plane, and nothing in the sequence ever told the eye it is a solid. One
     highlight band travels across the letterform after it has finished
     drawing, clipped to the facets themselves so light lands ON the letter
     and nowhere else. Screen blend so it adds light rather than painting
     ivory over the gradients. The band is translated inside a pre-rotated
     group: rotating in CSS would override the group's own rotate attribute,
     and translate alone needs no transform-origin -- which matters here,
     see the .wipe note above on fill-box ghost paints. */
  .spec { opacity: 0; animation: spec-on 1200ms 2250ms ease-out forwards; mix-blend-mode: screen; }
  .spec-band { transform: translateX(-30px); animation: spec-sweep 1200ms 2250ms cubic-bezier(.3,0,.25,1) forwards; }

  .words { display: grid; gap: 6px; }
  /* PER-LETTER, AND TRANSFORM-ONLY. This used to animate `letter-spacing`
     from .55em to .16em over 900ms -- a layout-bound property, on the
     biggest text on screen, reflowing the wordmark every frame. The look
     was right and the mechanism was not. Each letter now carries its own
     translate: an outward X offset that collapses to 0 reproduces the
     tracking-in, and a small Y lift gives the arrival. Both composite.
     The final .16em tracking is now STATIC, so the word occupies its final
     box from the first frame and nothing around it can shift. */
  .word {
    font-weight: 700; font-size: clamp(56px, 9vw, 96px); line-height: 1;
    letter-spacing: .16em; display: flex;
  }
  .word span {
    opacity: 0;
    animation: letter-in 780ms var(--ease-entry) forwards;
  }
  /* Outward offsets mirror around the word's centre, so it reads as the
     letters CLOSING IN rather than sliding in from one side. */
  .word span:nth-child(1) { transform: translate(-14px, 12px); animation-delay: 2150ms; }
  .word span:nth-child(2) { transform: translate(-5px, 12px);  animation-delay: 2225ms; }
  .word span:nth-child(3) { transform: translate(5px, 12px);   animation-delay: 2300ms; }
  .word span:nth-child(4) { transform: translate(14px, 12px);  animation-delay: 2375ms; }
  .product {
    /* THE LIGHT ACCENT, not the mid one. Action-Aura-Brand-Guide.md line
       59: products set "Aura" in ivory/navy plus the product name "in its
       light accent (dark surfaces) or mid/deep accent (light surfaces)".
       This is a dark surface, so the light accent is the guide's own
       answer -- and it measures 10.09:1 on this field against the mid
       accent's 5.44:1, so the guide-correct choice is also the legible
       one. */
    font-weight: 300; font-size: clamp(16px, 2.4vw, 26px); letter-spacing: .5em; color: var(--accent-light);
    opacity: 0; animation: fade-in 700ms 2850ms ease-out forwards;
  }
  .line {
    position: absolute; bottom: 12%; left: 0; right: 0; text-align: center;
    font-weight: 300; font-size: clamp(14px, 1.8vw, 20px); letter-spacing: .12em; color: rgba(246, 244, 239, 0.72);
    opacity: 0; transform: translateY(8px);
    animation: line-in 900ms 3500ms var(--ease-entry) forwards;
  }
  @keyframes ring-draw { from { stroke-dashoffset: 1; } to { stroke-dashoffset: 0; } }
  @keyframes facet-wipe { from { transform: scaleY(0); } to { transform: scaleY(1); } }
  @keyframes facets-fade { from { opacity: 0; } to { opacity: 1; } }
  @keyframes halo-in { from { opacity: 0; transform: scale(.3); } to { opacity: .3; transform: scale(1); } }
  @keyframes core-in { from { opacity: 0; transform: scale(.3); } to { opacity: 1; transform: scale(1); } }
  @keyframes letter-in { to { opacity: 1; transform: translate(0, 0); } }
  @keyframes line-in   { to { opacity: 1; transform: translateY(0); } }
  @keyframes settle    { from { transform: scale(1); } to { transform: scale(1.015); } }
  @keyframes spec-on   { 0% { opacity: 0; } 18% { opacity: 1; } 78% { opacity: 1; } 100% { opacity: 0; } }
  @keyframes spec-sweep { from { transform: translateX(-30px); } to { transform: translateX(186px); } }
  @keyframes fade-in { to { opacity: 1; } }
  @keyframes aurora-in { to { opacity: 1; } }
  @keyframes aurora-drift { from { transform: translate3d(0,0,0) rotate(0deg); } to { transform: translate3d(2%, -3%, 0) rotate(3deg); } }
  @media (prefers-reduced-motion: reduce) {
    .aurora, .ring-back, .ring-front, .wipe, .facets, .node-halo, .node-core,
    .word span, .product, .line, .lockup, .spec, .spec-band { animation: none !important; }
    .aurora { opacity: 1; }
    .ring-back, .ring-front { stroke-dashoffset: 0; }
    .wipe { transform: scaleY(1); }
    .facets { opacity: 1; }
    .node-halo { opacity: .3; transform: scale(1); }
    .node-core { opacity: 1; transform: scale(1); }
    .word span { opacity: 1; transform: none; }
    .lockup { transform: none; }
    /* The specular pass is a moving highlight; at rest there is no
       moment for it to occupy, so it is simply absent rather than
       frozen mid-sweep across the letter. */
    .spec { opacity: 0; }
    .product { opacity: 1; }
    .line { opacity: 1; transform: none; }
  }
</style>
</head>
<body>
<div class="stage">
  <div class="aurora"></div>
  <div class="depth"></div>
  <div class="grain"></div>
  <div class="lockup">
    <svg class="mark" viewBox="0 0 120 120" aria-hidden="true">
      <defs>
        <linearGradient id="i-fl" x1="0%" y1="0%" x2="0%" y2="100%">
          <stop offset="0%" stop-color="#F0B87A"/><stop offset="100%" stop-color="#C97B3D"/>
        </linearGradient>
        <!-- #22304A, NOT the brand navy #16233D -- BRAND KIT v2 (2026-09-20).
             The shadow facet fades to navy on the LIGHT master, where navy
             reads against a pale page. This intro's ground IS navy #16233D,
             so a facet ending at #16233D measures 1.00:1 against it -- the
             same colour, exactly. Rendered and looked at: the A's entire
             right leg dissolved into the background and the mark read as
             lopsided and broken.
             Action-Aura-Brand-Guide.md's v2 edition names this exact value:
             "Lifted navy #22304A -- shadow facet on DARK surfaces, so the
             letter doesn't sink". A prior pass here used #223B5E instead,
             pulled from the v1 kit's own dark master because #22304A did
             not exist yet -- replaced now that the guide ships the official
             value. Measured: #22304A on this #16233D ground is 1.18:1 (the
             prior #223B5E measured 1.38:1), which is fine and deliberate:
             a faceted solid reads by its INTERNAL contrast
             against the lit facet beside it, not by its silhouette against
             the page. What it must not be is IDENTICAL to the page. -->
        <linearGradient id="i-fr" x1="0%" y1="0%" x2="0%" y2="100%">
          <stop offset="0%" stop-color="#A06030"/><stop offset="100%" stop-color="#22304A"/>
        </linearGradient>
        <linearGradient id="i-rb" x1="0%" y1="0%" x2="100%" y2="0%">
          <stop offset="0%" stop-color="#22304A"/><stop offset="100%" stop-color="#C97B3D"/>
        </linearGradient>
        <linearGradient id="i-rf" x1="0%" y1="0%" x2="100%" y2="0%">
          <stop offset="0%" stop-color="#C97B3D"/><stop offset="100%" stop-color="#F0B87A"/>
        </linearGradient>
        <!-- The letterform itself, used to confine the specular pass to
             the two facets. Same two paths the .facets group draws. -->
        <clipPath id="i-letter" clipPathUnits="userSpaceOnUse">
          <path d="M60 12.6 L60 56 L40 104 L22 104 Z"/>
          <path d="M60 12.6 L98 104 L80 104 L60 56 Z"/>
        </clipPath>
        <linearGradient id="i-spec" x1="0%" y1="0%" x2="100%" y2="0%">
          <stop offset="0%" stop-color="#FBE3C4" stop-opacity="0"/>
          <stop offset="50%" stop-color="#FBE3C4" stop-opacity="0.34"/>
          <stop offset="100%" stop-color="#FBE3C4" stop-opacity="0"/>
        </linearGradient>
        <clipPath id="i-reveal" clipPathUnits="userSpaceOnUse">
          <rect class="wipe" x="0" y="0" width="120" height="120"/>
        </clipPath>
      </defs>
      <!-- 1. ring back-arc: passes BEHIND the letter's shoulders -->
      <path class="ring-back" pathLength="1" d="M 24 69 A 36 8 0 0 1 96 69" transform="rotate(-12 60 69)"
        fill="none" stroke="url(#i-rb)" stroke-width="5" opacity="0.55"/>
      <!-- 2. letterform: two filled facets + lit ridge + Retail's square
           counter glyph, wiped in top-down (apex first). The back-arc
           above becomes visible only through the open triangular counter
           once this group is drawn over it; "shows through the counter"
           falls out of z-order, not a separate animation step. -->
      <g clip-path="url(#i-reveal)">
        <g class="facets">
          <path d="M60 12.6 L60 56 L40 104 L22 104 Z" fill="url(#i-fl)"/>
          <path d="M60 12.6 L98 104 L80 104 L60 56 Z" fill="url(#i-fr)"/>
          <line x1="60" y1="12.6" x2="60" y2="56" stroke="#F6F4EF" stroke-width="1.3" opacity="0.9"/>
          <rect x="55.5" y="81.5" width="9" height="9" rx="2" fill="#C97B3D"/>
        </g>
        <g class="spec" clip-path="url(#i-letter)">
          <g transform="rotate(-16 60 60)">
            <rect class="spec-band" x="-30" y="-24" width="18" height="168" fill="url(#i-spec)"/>
          </g>
        </g>
      </g>
      <!-- 3. ring front-arc: sweeps ACROSS THE FRONT of the legs -->
      <path class="ring-front" pathLength="1" d="M 24 69 A 36 8 0 0 0 96 69" transform="rotate(-12 60 69)"
        fill="none" stroke="url(#i-rf)" stroke-width="6" stroke-linecap="round"/>
      <!-- 4. energy node: sits where the front-arc's sweep ends -->
      <circle class="node-halo" cx="95.2" cy="61.5" r="7.5" fill="#F0B87A"/>
      <circle class="node-core" cx="95.2" cy="61.5" r="4" fill="#F6F4EF"/>
    </svg>
    <div class="words">
      <!-- One span per letter so the tracking-in is transform-driven.
           aria-hidden on the pieces + one label on the parent keeps it a
           single word to a screen reader rather than four letters; the
           whole mark is decorative here anyway (the svg is aria-hidden
           and this overlay is transient). -->
      <div class="word" role="img" aria-label="AURA"
        ><span aria-hidden="true">A</span><span aria-hidden="true">U</span><span aria-hidden="true">R</span><span aria-hidden="true">A</span></div>
      <div class="product">RETAIL</div>
    </div>
  </div>
  <div class="line">One shop. Every device.</div>
</div>
</body>
</html>
