<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Aura</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;700&display=swap">
<style>
  /* Aura intro -- one scene, about six seconds, self-contained.
     A luminous ring is drawn around an A, a beacon lights at the ring's
     opening, the wordmark settles from wide tracking, one line of copy.
     Reduced motion: the final frame, no drawing. */
  :root {
    --ground: #070b12;
    --ink: #edf2f8;
    --teal: #5fe3d0;
    --blue: #3f7be6;
    --deep: #1745a9;
    --t-ring: 1400ms;
    --t-a: 700ms;
  }
  html, body { height: 100%; margin: 0; background: var(--ground); color: var(--ink);
    font-family: Outfit, "Segoe UI", system-ui, sans-serif; overflow: hidden; }
  .stage { position: relative; height: 100%; display: grid; place-items: center; }
  .aurora {
    position: absolute; inset: -20%; pointer-events: none;
    background:
      radial-gradient(60% 45% at 68% 30%, rgba(95, 227, 208, 0.20), transparent 70%),
      radial-gradient(55% 50% at 30% 72%, rgba(63, 123, 230, 0.22), transparent 70%);
    filter: blur(40px);
    opacity: 0;
    animation: aurora-in 2400ms 200ms cubic-bezier(.2,.7,.2,1) forwards, aurora-drift 14s 2600ms ease-in-out infinite alternate;
  }
  .grain {
    position: absolute; inset: 0; pointer-events: none; opacity: .06; mix-blend-mode: overlay;
    background-image: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='160' height='160'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='.9' numOctaves='2' stitchTiles='stitch'/></filter><rect width='100%' height='100%' filter='url(%23n)'/></svg>");
  }
  .lockup { position: relative; display: grid; grid-template-columns: auto auto; align-items: center; gap: 44px; }
  .mark { width: clamp(140px, 24vw, 220px); height: auto; }
  .ring { stroke-dasharray: 492 99; stroke-dashoffset: 460; animation: ring-draw var(--t-ring) 500ms cubic-bezier(.65,0,.2,1) forwards; }
  .spark { opacity: 0; transform-origin: 196px 60px; animation: spark-in 700ms 1750ms cubic-bezier(.2,.9,.3,1.4) forwards; }
  .a-peak { stroke-dasharray: 230; stroke-dashoffset: 230; animation: a-draw var(--t-a) 1150ms cubic-bezier(.4,0,.2,1) forwards; }
  .a-bar { stroke-dasharray: 46; stroke-dashoffset: 46; animation: a-draw 300ms 1800ms ease-out forwards; }
  .words { display: grid; gap: 6px; }
  .word {
    font-weight: 700; font-size: clamp(56px, 9vw, 96px); line-height: 1; letter-spacing: .55em;
    opacity: 0; transform: translateY(10px);
    animation: word-in 1100ms 1900ms cubic-bezier(.2,.8,.2,1) forwards;
  }
  .product {
    font-weight: 300; font-size: clamp(16px, 2.4vw, 26px); letter-spacing: .5em; color: var(--teal);
    opacity: 0; animation: fade-in 800ms 2700ms ease-out forwards;
  }
  .line {
    position: absolute; bottom: 12%; left: 0; right: 0; text-align: center;
    font-weight: 300; font-size: clamp(14px, 1.8vw, 20px); letter-spacing: .12em; color: rgba(237, 242, 248, 0.72);
    opacity: 0; animation: fade-in 1000ms 3400ms ease-out forwards;
  }
  @keyframes ring-draw { to { stroke-dashoffset: -32; } }
  @keyframes spark-in { from { opacity: 0; transform: scale(.2); } to { opacity: 1; transform: scale(1); } }
  @keyframes a-draw { to { stroke-dashoffset: 0; } }
  @keyframes word-in { to { opacity: 1; transform: translateY(0); letter-spacing: .16em; } }
  @keyframes fade-in { to { opacity: 1; } }
  @keyframes aurora-in { to { opacity: 1; } }
  @keyframes aurora-drift { from { transform: translate3d(0,0,0) rotate(0deg); } to { transform: translate3d(2%, -3%, 0) rotate(3deg); } }
  @media (prefers-reduced-motion: reduce) {
    .aurora, .ring, .spark, .a-peak, .a-bar, .word, .product, .line { animation: none !important; }
    .aurora { opacity: 1; } .ring { stroke-dashoffset: -32; } .spark, .product, .line { opacity: 1; }
    .a-peak, .a-bar { stroke-dashoffset: 0; } .word { opacity: 1; transform: none; letter-spacing: .16em; }
  }
</style>
</head>
<body>
<div class="stage">
  <div class="aurora"></div>
  <div class="grain"></div>
  <div class="lockup">
    <svg class="mark" viewBox="0 0 256 256" aria-hidden="true">
      <defs>
        <linearGradient id="ring-g" x1="0.15" y1="0.9" x2="0.85" y2="0.1">
          <stop offset="0" stop-color="#3f7be6"/><stop offset="0.55" stop-color="#6ea8ff"/><stop offset="1" stop-color="#5fe3d0"/>
        </linearGradient>
      </defs>
      <circle class="ring" cx="128" cy="128" r="94" fill="none" stroke="url(#ring-g)" stroke-width="15" stroke-linecap="round" transform="rotate(-90 128 128)"/>
      <path class="spark" d="M 196 45 L 211 60 L 196 75 L 181 60 Z" fill="#edf2f8"/>
      <path class="a-peak" d="M 84 178 L 128 70 L 172 178" fill="none" stroke="#edf2f8" stroke-width="26" stroke-linecap="round" stroke-linejoin="round"/>
      <path class="a-bar" d="M 108 142 L 148 142" fill="none" stroke="#edf2f8" stroke-width="20" stroke-linecap="round"/>
    </svg>
    <div class="words">
      <div class="word">AURA</div>
      <div class="product">RETAIL</div>
    </div>
  </div>
  <div class="line">One shop. Every device.</div>
</div>
</body>
</html>
