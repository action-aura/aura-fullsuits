<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" role="img" aria-labelledby="t">
  <title id="t">Aura Retail mark, flat</title>
  <!-- 2026-09-19: REDESIGNED. This file's job is unchanged from before --
       one flat ink per shape, no gradients anywhere, for the sub-64px and
       single-colour-print path (favicons, thermal receipts, embroidery,
       stamps) -- but the geometry is now the new pierced-A mark, flat per
       Action-Aura-Brand-Guide.md's aura-mark-flat.svg construction (navy
       letterform + one accent-colour ring stroke, no gradients, no counter
       glyph -- the source flat master carries neither a gradient nor a
       product counter, and a 9-unit square would not read at these sizes
       anyway), tinted with Retail's own mid accent #C97B3D instead of the
       master teal so the ring colour alone still identifies this as
       Retail. This IS the geometry AuraIcons.mark() in icons.js renders
       inline for size < 64 -- both of this repo's real call sites
       (app-shell.js's auth overlay and sidebar brand slot) pass 40, so this
       flat geometry, not the 3D one, is what is actually on screen today. -->
  <path d="M60 12.6 L98 104 L80 104 L60 56 L40 104 L22 104 Z" fill="#16233D"/>
  <path d="M 24 69 A 36 8 0 0 0 96 69" transform="rotate(-12 60 69)" fill="none" stroke="#C97B3D" stroke-width="9" stroke-linecap="round"/>
</svg>
