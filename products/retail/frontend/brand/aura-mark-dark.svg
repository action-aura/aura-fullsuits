<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" role="img" aria-labelledby="t">
  <title id="t">Aura mark, dark ground</title>
  <!-- Master Action Aura mark ("pierced A") for DARK backgrounds -- same
       construction as aura-mark-light.svg, facets and ring brightened for
       legibility on a dark ground. See that file's comment for the
       construction notes; this is the master/generic identity (teal
       accent), not the Retail product variant (aura-mark-on-dark.svg /
       aura-retail.svg carry the retail accent + square counter). -->
  <defs>
    <linearGradient id="fl" x1="0%" y1="0%" x2="0%" y2="100%"><stop offset="0%" stop-color="#9FDCD8"/><stop offset="100%" stop-color="#4FA09B"/></linearGradient>
    <linearGradient id="fr" x1="0%" y1="0%" x2="0%" y2="100%"><stop offset="0%" stop-color="#3E7E88"/><stop offset="100%" stop-color="#1E3A5A"/></linearGradient>
    <linearGradient id="rb" x1="0%" y1="0%" x2="100%" y2="0%"><stop offset="0%" stop-color="#223B5E"/><stop offset="100%" stop-color="#3E8E89"/></linearGradient>
    <linearGradient id="rf" x1="0%" y1="0%" x2="100%" y2="0%"><stop offset="0%" stop-color="#4FA09B"/><stop offset="100%" stop-color="#B8ECE8"/></linearGradient>
  </defs>
  <path d="M 24 69 A 36 8 0 0 1 96 69" transform="rotate(-12 60 69)" fill="none" stroke="url(#rb)" stroke-width="5" opacity="0.6"/>
  <path d="M60 12.6 L60 56 L40 104 L22 104 Z" fill="url(#fl)"/>
  <path d="M60 12.6 L98 104 L80 104 L60 56 Z" fill="url(#fr)"/>
  <line x1="60" y1="12.6" x2="60" y2="56" stroke="#E8FBF9" stroke-width="1.3" opacity="0.95"/>
  <path d="M 24 69 A 36 8 0 0 0 96 69" transform="rotate(-12 60 69)" fill="none" stroke="url(#rf)" stroke-width="6" stroke-linecap="round"/>
  <circle cx="95.2" cy="61.5" r="7.5" fill="#B8ECE8" opacity="0.3"/>
  <circle cx="95.2" cy="61.5" r="4" fill="#EDFDFC"/>
</svg>
