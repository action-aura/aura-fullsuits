<!doctype html>
<html lang="en" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Aura Retail — Licensing</title>
<link rel="icon" type="image/svg+xml" href="brand/aura-app-icon.svg">
<script>
  // FINAL polish F3 -- same boot-theme contract as whatsapp.html/
  // einvoicing.html/site-relay.html (read ONLY 'aura_theme_v2', validate
  // through the allowlist, fall back to 'light'), copied rather than shared:
  // this page is not part of the app shell. Runs BEFORE main.css so the first
  // paint already carries the shop's theme.
  (function () {
    try {
      var saved = null;
      try { saved = localStorage.getItem('aura_theme_v2'); } catch (e) {}
      var names = ['light', 'sand', 'dark', 'night', 'dusk'];
      document.documentElement.setAttribute('data-theme', names.indexOf(saved) !== -1 ? saved : 'light');
    } catch (e) {}
  })();
</script>
<link rel="stylesheet" href="css/main.css">
<link rel="stylesheet" href="css/rtl.css">
<style>
  /* F3: tokenised (css/main.css) instead of this page's old literal-colour +
     prefers-color-scheme palette, so it follows the shop's chosen theme and
     no longer looks like a different program from the app it belongs to. */
  body {
    font-family: var(--font-base, -apple-system, Segoe UI, Roboto, sans-serif);
    max-width: 520px; margin: 48px auto; padding: 0 20px;
    color: var(--text); background: var(--app-bg);
    /* css/main.css's shell-scoped `body{overflow:hidden}` would leave this
       page unscrollable by real mouse wheel or the End key (same fix as
       whatsapp.html / site-relay.html). Page-scoped override, source order. */
    overflow-y: auto;
  }
  h1 { font-size: 1.4rem; margin-bottom: 4px; }
  .subtitle { color: var(--text-dim); margin-bottom: 28px; font-size: 0.9rem; }
  .card {
    background: var(--surface-card); border: 1px solid var(--border-soft);
    border-radius: var(--radius-card, 10px);
    padding: 24px; margin-bottom: 16px;
  }
  .state-badge {
    display: inline-block; padding: 4px 10px; border-radius: 20px;
    font-size: 0.8rem; font-weight: 600; margin-bottom: 12px;
  }
  .state-active { background: var(--state-success-surface); color: var(--state-success-text); }
  .state-warning { background: var(--state-warning-surface); color: var(--state-warning-text); }
  .state-restricted { background: var(--state-danger-surface); color: var(--state-danger-text); }
  .state-neutral { background: var(--surface-hover); color: var(--text-dim); }
  label { display: block; font-size: 0.85rem; font-weight: 600; margin-bottom: 6px; }
  input[type=text] {
    width: 100%; padding: 10px 12px; border-radius: 6px;
    border: 1px solid var(--border-soft); background: var(--input-bg); color: var(--text);
    font-size: 0.95rem; box-sizing: border-box; margin-bottom: 12px;
  }
  button {
    background: var(--accent-action); color: var(--text-on-accent); border: none; border-radius: 6px;
    padding: 10px 18px; font-size: 0.9rem; font-weight: 600; cursor: pointer;
  }
  button:hover { filter: brightness(0.92); }
  button:disabled { background: var(--surface-hover); color: var(--text-faint); cursor: not-allowed; filter: none; }
  button.secondary { background: transparent; color: var(--accent-action); border: 1px solid var(--accent-action); }
  /* Deactivate: an OUTLINED danger button, never a filled red one. Listed
     after .secondary so the danger colour wins when a button carries both. */
  button.danger { background: transparent; color: var(--state-danger-text); border: 1px solid var(--state-danger-text); }
  .row { display: flex; gap: 10px; flex-wrap: wrap; margin-top: 16px; }
  .message { padding: 10px 12px; border-radius: 6px; font-size: 0.88rem; margin-bottom: 14px; }
  .message-error { background: var(--state-danger-surface); color: var(--state-danger-text); }
  .message-info { background: var(--state-info-surface); color: var(--state-info-text); }
  dl { margin: 0; }
  dt { font-size: 0.78rem; color: var(--text-dim); margin-top: 10px; }
  dd { margin: 0; font-size: 0.92rem; }
  /* Collapsed "Technical details": the raw ids support may ask for. */
  .tech-details { margin-top: 20px; border-top: 1px solid var(--border-soft); padding-top: 12px; }
  .tech-details summary {
    cursor: pointer; font-size: 0.82rem; color: var(--text-dim); font-weight: 600;
  }
  .tech-details dd { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; font-size: 0.82rem; word-break: break-all; }
  .support { font-size: 0.85rem; color: var(--text-dim); margin-top: 24px; }
  .back-link {
    display: inline-block; margin-bottom: 18px; font-size: 0.85rem;
    color: var(--accent-action); text-decoration: none;
  }
  .back-link:hover { text-decoration: underline; }
  .spinner { display: inline-block; width: 14px; height: 14px; border: 2px solid var(--text-on-accent);
    border-top-color: transparent; border-radius: 50%; animation: spin 0.7s linear infinite; }
  @keyframes spin { to { transform: rotate(360deg); } }
  /* Confirm dialog (replaces native confirm() -- see licensing.js's
     confirmDialog). */
  .confirm-overlay {
    position: fixed; inset: 0; z-index: 1000; background: rgba(0,0,0,0.5);
    display: flex; align-items: center; justify-content: center; padding-inline: 20px;
  }
  .confirm-card {
    background: var(--surface-card); border: 1px solid var(--border-soft);
    border-radius: var(--radius-card, 10px); padding: 24px; max-width: 420px; width: 100%;
  }
  .confirm-card h3 { margin: 0 0 10px; font-size: 1.1rem; }
  .confirm-message { margin: 0 0 18px; font-size: 0.9rem; color: var(--text-dim); line-height: 1.5; }
  /* i18n/RTL: main.css + css/rtl.css are loaded above; the back-arrow glyph
     is a literal "&larr;" character, so it still needs an explicit flip.
     i18n.js sets dir="rtl" on <html> when Arabic is active. */
  [dir="rtl"] .i18n-arrow { display: inline-block; transform: scaleX(-1); }
  [hidden] { display: none !important; }
</style>
</head>
<body>
  <!-- This page is a standalone route (see licensing.js header comment) that
       was, until now, unreachable from and unable to return to the main app
       shell -- there was no nav entry into it and no link back out of it.
       This anchor closes the loop: index.html's root route ('/') re-renders
       the authenticated shell from the existing session cookie. -->
  <a class="back-link" href="/"><span class="i18n-arrow">&larr;</span> <span data-i18n="Back to Aura Retail">Back to Aura Retail</span></a>
  <h1 data-i18n="Aura Retail Licensing">Aura Retail Licensing</h1>
  <div class="subtitle" data-i18n="Activation and license status for this installation.">Activation and license status for this installation.</div>

  <div id="message-area"></div>
  <div id="content" class="card" data-i18n="Loading…">Loading…</div>

  <div class="support" data-i18n="Need help? Contact Action Aura support with your installation status shown above.">
    Need help? Contact Action Aura support with your installation status shown above.
  </div>

  <script src="i18n.js"></script>
  <script src="licensing.js"></script>
</body>
</html>
