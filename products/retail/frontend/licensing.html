<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Aura Retail — Licensing</title>
<style>
  :root { color-scheme: light dark; }
  body {
    font-family: -apple-system, Segoe UI, Roboto, sans-serif;
    max-width: 520px; margin: 48px auto; padding: 0 20px;
    color: #1a1a1a; background: #fafafa;
  }
  @media (prefers-color-scheme: dark) { body { color: #e8e8e8; background: #16181c; } }
  h1 { font-size: 1.4rem; margin-bottom: 4px; }
  .subtitle { color: #666; margin-bottom: 28px; font-size: 0.9rem; }
  @media (prefers-color-scheme: dark) { .subtitle { color: #999; } }
  .card {
    background: #fff; border: 1px solid #e0e0e0; border-radius: 10px;
    padding: 24px; margin-bottom: 16px;
  }
  @media (prefers-color-scheme: dark) { .card { background: #1e2127; border-color: #333; } }
  .state-badge {
    display: inline-block; padding: 4px 10px; border-radius: 20px;
    font-size: 0.8rem; font-weight: 600; margin-bottom: 12px;
  }
  .state-active { background: #d4f4dd; color: #1a7a3d; }
  .state-warning { background: #fff3cd; color: #8a6100; }
  .state-restricted { background: #fde2e2; color: #a3231f; }
  .state-neutral { background: #e5e7eb; color: #444; }
  @media (prefers-color-scheme: dark) {
    .state-active { background: #123a24; color: #6fd88f; }
    .state-warning { background: #4a3a05; color: #ffd873; }
    .state-restricted { background: #4a1616; color: #ff8f8a; }
    .state-neutral { background: #2a2d33; color: #ccc; }
  }
  label { display: block; font-size: 0.85rem; font-weight: 600; margin-bottom: 6px; }
  input[type=text] {
    width: 100%; padding: 10px 12px; border-radius: 6px; border: 1px solid #ccc;
    font-size: 0.95rem; box-sizing: border-box; margin-bottom: 12px;
  }
  @media (prefers-color-scheme: dark) { input[type=text] { background: #14161a; border-color: #444; color: #eee; } }
  button {
    background: #2563eb; color: #fff; border: none; border-radius: 6px;
    padding: 10px 18px; font-size: 0.9rem; font-weight: 600; cursor: pointer;
  }
  button:hover { background: #1d4ed8; }
  button:disabled { background: #93a3c0; cursor: not-allowed; }
  button.secondary { background: transparent; color: #2563eb; border: 1px solid #2563eb; }
  button.danger { background: transparent; color: #c0231f; border: 1px solid #c0231f; }
  .row { display: flex; gap: 10px; flex-wrap: wrap; }
  .message { padding: 10px 12px; border-radius: 6px; font-size: 0.88rem; margin-bottom: 14px; }
  .message-error { background: #fde2e2; color: #a3231f; }
  .message-info { background: #e0edff; color: #1e429f; }
  @media (prefers-color-scheme: dark) {
    .message-error { background: #3a1616; color: #ff8f8a; }
    .message-info { background: #16233a; color: #8fb4ff; }
  }
  dl { margin: 0; }
  dt { font-size: 0.78rem; color: #777; margin-top: 10px; }
  dd { margin: 0; font-size: 0.92rem; }
  .support { font-size: 0.85rem; color: #777; margin-top: 24px; }
  .back-link {
    display: inline-block; margin-bottom: 18px; font-size: 0.85rem;
    color: #2563eb; text-decoration: none;
  }
  .back-link:hover { text-decoration: underline; }
  @media (prefers-color-scheme: dark) { .back-link { color: #8fb4ff; } }
  .spinner { display: inline-block; width: 14px; height: 14px; border: 2px solid #fff;
    border-top-color: transparent; border-radius: 50%; animation: spin 0.7s linear infinite; }
  @keyframes spin { to { transform: rotate(360deg); } }
</style>
</head>
<body>
  <!-- This page is a standalone route (see licensing.js header comment) that
       was, until now, unreachable from and unable to return to the main app
       shell -- there was no nav entry into it and no link back out of it.
       This anchor closes the loop: index.html's root route ('/') re-renders
       the authenticated shell from the existing session cookie. -->
  <a class="back-link" href="/">&larr; Back to Aura Retail</a>
  <h1>Aura Retail Licensing</h1>
  <div class="subtitle">Activation and license status for this installation.</div>

  <div id="message-area"></div>
  <div id="content" class="card">Loading…</div>

  <div class="support">
    Need help? Contact Action Aura support with your installation status shown above.
  </div>

  <script src="licensing.js"></script>
</body>
</html>
