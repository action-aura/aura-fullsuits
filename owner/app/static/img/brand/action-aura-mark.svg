<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" role="img" aria-labelledby="t">
  <title id="t">Aura Owner mark, flat</title>
  <!-- 2026-09-19: REPLACED. This file used to hold a hand-built RECREATION of
       an old, never-committed circular-badge mark (near-black badge, conic
       rainbow ring, "ACTION"/"AURA" text) - see this repo's own audit note
       at docs/owner/ui-modernization/logo-brand-audit.md section 7 for that
       history. The owner has since delivered a finished, real identity,
       Action-Aura-Brand-Guide.md: a faceted letter A read through the Greek
       delta (the "pierced A"), pierced by a tilted orbit ring that passes
       BEHIND the letter's shoulders, shows THROUGH the counter, and sweeps
       ACROSS THE FRONT of the legs to a bright energy node.

       This surface is the AURA OWNER PRODUCT (the owner's own console:
       branches, KPIs, alerts), not the Action/Aura MASTER lockup: every
       heading and title in base.html reads "Aura Owner" / "Aura Owner
       Control Center", never "Action Aura", matching the guide's own
       product table ("Aura Owner - the owner's console"), so per the
       guide's family rule this mark is tinted with Owner's own accent
       (dark #96761F, mid #C9A227, light #E8CD7A) and would carry Owner's
       diamond counter glyph at 3D size. See
       products/retail/frontend/brand/aura-mark-light.svg for what that
       looks like on Retail's own accent, or the delivered aura-owner.svg
       source for Owner's own 3D/gradient version.

       This particular file is the FLAT construction, not the 3D one: per
       the guide's "Usage" section, the gradient/facet construction has a
       64px minimum, and both real call sites in base.html render this
       asset well under that (a 28x28 sidebar mark, and a favicon). So,
       mirroring products/retail/frontend/brand/aura-mark-1bit.svg's own
       flat treatment exactly, this is one flat navy fill for the
       letterform (the shared cross-product constant) plus one flat stroke
       in Owner's mid accent for the ring, no gradients, no counter glyph
       (too small to read at this size, same reasoning as Retail's and the
       guide's own flat master). -->
  <path d="M60 12.6 L98 104 L80 104 L60 56 L40 104 L22 104 Z" fill="#16233D"/>
  <path d="M 24 69 A 36 8 0 0 0 96 69" transform="rotate(-12 60 69)" fill="none" stroke="#C9A227" stroke-width="9" stroke-linecap="round"/>
</svg>
