{% extends "layout/base.html" %}
{% block title %}{{ _("New cash closing") }}{% endblock %}
{% block content %}
<div class="card">
  <h2>{{ _("New cash closing") }}</h2>
  {% if error %}<p class="error">{{ error }}</p>{% endif %}
  <form method="post" action="{{ url_for('operations_ui.create_closing_route') }}">
    <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
    <label for="operations-ui-cash-closing-new-business-date">{{ _("Business date") }}</label>
    <input id="operations-ui-cash-closing-new-business-date" name="business_date" type="date" required>
    <label for="operations-ui-cash-closing-new-currency">{{ _("Currency") }}</label>
    <input id="operations-ui-cash-closing-new-currency" name="currency" value="USD" maxlength="3" required>
    <label for="operations-ui-cash-closing-new-opening-cash-override">{{ _("Opening cash override (first closing only)") }}</label>
    <input id="operations-ui-cash-closing-new-opening-cash-override" name="opening_cash_override" type="text" inputmode="decimal">
    <label for="operations-ui-cash-closing-new-opening-cash-override-reason">{{ _("Override reason") }}</label>
    <input id="operations-ui-cash-closing-new-opening-cash-override-reason" name="opening_cash_override_reason">
    <button type="submit">{{ _("Create closing") }}</button>
  </form>
</div>
{% endblock %}
