{% extends "layout/base.html" %}
{% block title %}{{ _('Forgot your password?') }}{% endblock %}
{% block content %}
<div class="aura-auth-card">
  <h2>{{ _('Forgot your password?') }}</h2>
  <p>{{ _('If an account exists for that email, a reset link has been sent.') }}</p>
  <p><a href="{{ url_for('auth.login_form') }}">{{ _('Back to sign in') }}</a></p>
</div>
{% endblock %}
