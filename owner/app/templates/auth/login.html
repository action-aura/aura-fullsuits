{% extends "layout/base.html" %}
{% block title %}{{ _('Login') }}{% endblock %}
{% block content %}
<div class="aura-auth-brand">
  <span class="aura-auth-brand__mark" aria-hidden="true">A</span>
  <span>{{ _('Aura Owner') }}</span>
</div>
<div class="aura-auth-card">
  <h2>{{ _('Sign in') }}</h2>
  {% if notice %}<div class="aura-auth-notice">{{ notice }}</div>{% endif %}
  {% if error %}<div class="error" role="alert">{{ error }}</div>{% endif %}
  <form method="post">
    <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
    <label for="email">{{ _('Email') }}</label>
    <input id="email" type="email" name="email" required autofocus autocomplete="username">
    <label for="password">{{ _('Password') }}</label>
    <div class="aura-password-field">
      <input id="password" type="password" name="password" required autocomplete="current-password"
             data-show-text="{{ _('Show') }}" data-hide-text="{{ _('Hide') }}"
             data-show-label="{{ _('Show password') }}" data-hide-label="{{ _('Hide password') }}">
    </div>
    <div class="aura-auth-actions"><button type="submit" class="btn">{{ _('Log in') }}</button></div>
  </form>
</div>
{% endblock %}
