{% extends "layout/base.html" %}
{% block title %}{{ _('Verify MFA') }}{% endblock %}
{% block content %}
<div class="card" style="max-width:380px;margin:2rem auto;">
  <h2>{{ _('Enter your authenticator code') }}</h2>
  {% if error %}<div class="error">{{ error }}</div>{% endif %}
  <form method="post">
    <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
    <label for="code">{{ _('6-digit code (or a recovery code)') }}</label>
    <input id="code" name="code" required autofocus autocomplete="one-time-code">
    <div style="margin-top:1rem;"><button type="submit">{{ _('Verify') }}</button></div>
  </form>
</div>
{% endblock %}
