{% extends "layout/base.html" %}
{% block title %}{{ _('Change password') }}{% endblock %}
{% block content %}
<div class="aura-auth-card">
  <h2>{{ _('Change password') }}</h2>
  {% if error %}<div class="error" role="alert">{{ error }}</div>{% endif %}
  <form method="post">
    <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
    <label for="current_password">{{ _('Current password') }}</label>
    <div class="aura-password-field">
      <input id="current_password" type="password" name="current_password" required autocomplete="current-password"
             data-show-text="{{ _('Show') }}" data-hide-text="{{ _('Hide') }}"
             data-show-label="{{ _('Show password') }}" data-hide-label="{{ _('Hide password') }}">
    </div>
    <label for="new_password">{{ _('New password (min 12 chars, mix of 3 character classes)') }}</label>
    <div class="aura-password-field">
      <input id="new_password" type="password" name="new_password" required autocomplete="new-password"
             data-show-text="{{ _('Show') }}" data-hide-text="{{ _('Hide') }}"
             data-show-label="{{ _('Show password') }}" data-hide-label="{{ _('Hide password') }}">
    </div>
    <div class="aura-auth-actions"><button type="submit" class="btn">{{ _('Change password') }}</button></div>
  </form>
</div>
{% endblock %}
