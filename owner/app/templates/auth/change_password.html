{% extends "layout/base.html" %}
{% block title %}{{ _('Change password') }}{% endblock %}
{% block content %}
<div class="card" style="max-width:420px;">
  <h2>{{ _('Change password') }}</h2>
  {% if error %}<div class="error">{{ error }}</div>{% endif %}
  <form method="post">
    <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
    <label for="current_password">{{ _('Current password') }}</label>
    <input id="current_password" type="password" name="current_password" required>
    <label for="new_password">{{ _('New password (min 12 chars, mix of 3 character classes)') }}</label>
    <input id="new_password" type="password" name="new_password" required>
    <div style="margin-top:1rem;"><button type="submit">{{ _('Change password') }}</button></div>
  </form>
</div>
{% endblock %}
