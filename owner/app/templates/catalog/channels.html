{% extends "layout/base.html" %}
{% block title %}{{ _("Release channels") }}{% endblock %}
{% block content %}
<div class="card">
  <h2>{{ _("Release channels") }}</h2>
  <table class="responsive-table">
    <thead><tr><th>{{ _("Code") }}</th><th>{{ _("Name") }}</th></tr></thead>
    <tbody>
    {% for c in channels %}
    <tr><td><bdi dir="ltr">{{ c.channel_code }}</bdi></td><td>{{ c.name }}</td></tr>
    {% endfor %}
    </tbody>
  </table>
</div>
{% endblock %}
