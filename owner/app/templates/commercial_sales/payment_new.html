{% extends "layout/base.html" %}
{% block title %}{{ _("Record payment") }}{% endblock %}
{% block content %}
<div class="card">
  <h2>{{ _("Record payment") }}</h2>
  {% if error %}<p class="error">{{ error }}</p>{% endif %}
  <form method="post" action="{{ url_for('commercial_sales_web.submit_payment_route') }}">
    <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
    <label for="commercial-sales-payment-new-customer-id">{{ _("Customer") }}</label>
    <select id="commercial-sales-payment-new-customer-id" name="customer_id" required>
      {% for c in customers %}<option value="{{ c.id }}">{{ c.legal_name }}</option>{% endfor %}
    </select>
    <label for="commercial-sales-payment-new-amount">{{ _("Amount") }}</label>
    <input id="commercial-sales-payment-new-amount" name="amount" required>
    <label for="commercial-sales-payment-new-currency">{{ _("Currency") }}</label>
    <input id="commercial-sales-payment-new-currency" name="currency" value="USD" maxlength="3" required>
    <label for="commercial-sales-payment-new-method">{{ _("Method") }}</label>
    <select id="commercial-sales-payment-new-method" name="method">
      <option value="CASH">{{ _("Cash") }}</option>
      <option value="BANK_TRANSFER">{{ _("Bank transfer") }}</option>
      <option value="CARD_OFFLINE">{{ _("Card (offline)") }}</option>
      <option value="CHEQUE">{{ _("Cheque") }}</option>
      <option value="OTHER">{{ _("Other") }}</option>
    </select>
    <label for="commercial-sales-payment-new-payment-date">{{ _("Payment date") }}</label>
    <input id="commercial-sales-payment-new-payment-date" type="date" name="payment_date" required>
    <label for="commercial-sales-payment-new-commercial-invoice-id">{{ _("Invoice (optional)") }}</label>
    <input id="commercial-sales-payment-new-commercial-invoice-id" name="commercial_invoice_id" placeholder="{{ _('Invoice UUID') }}">
    <label for="commercial-sales-payment-new-reference">{{ _("Reference") }}</label>
    <input id="commercial-sales-payment-new-reference" name="reference">
    <button type="submit" style="margin-top:0.75rem;">{{ _("Record payment") }}</button>
  </form>
</div>
{% endblock %}
