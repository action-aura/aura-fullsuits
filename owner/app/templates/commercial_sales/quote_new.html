{% extends "layout/base.html" %}
{% block title %}{{ _("New quote") }}{% endblock %}
{% block content %}
<div class="card">
  <h2>{{ _("New quote") }}</h2>
  {% if error %}<p class="error">{{ error }}</p>{% endif %}
  <form method="post" action="{{ url_for('commercial_sales_web.create_quote_route') }}">
    <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
    <label for="commercial-sales-quote-new-customer-id">{{ _("Customer") }}</label>
    <select id="commercial-sales-quote-new-customer-id" name="customer_id" required>
      {% for c in customers %}<option value="{{ c.id }}">{{ c.legal_name }}</option>{% endfor %}
    </select>
    <label for="commercial-sales-quote-new-currency">{{ _("Currency") }}</label>
    <input id="commercial-sales-quote-new-currency" name="currency" value="USD" maxlength="3" required>
    <label>{{ _("Notes") }}</label>
    <textarea name="notes"></textarea>
    <button type="submit" style="margin-top:0.75rem;">{{ _("Create quote") }}</button>
  </form>
</div>
{% endblock %}
