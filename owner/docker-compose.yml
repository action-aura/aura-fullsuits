services:
  db:
    image: postgres:17
    environment:
      POSTGRES_USER: aura_owner
      POSTGRES_PASSWORD: aura_owner_dev
      POSTGRES_DB: aura_owner_dev
    ports:
      - "5432:5432"
    volumes:
      - owner_pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U aura_owner -d aura_owner_dev"]
      interval: 5s
      timeout: 5s
      retries: 10

  app:
    build:
      context: ..
      dockerfile: owner/Dockerfile
    env_file:
      - .env
    environment:
      OWNER_ENV: development
      OWNER_DATABASE_URL: postgresql+psycopg://aura_owner:aura_owner_dev@db:5432/aura_owner_dev
    ports:
      - "5551:5000"
    depends_on:
      db:
        condition: service_healthy
    command: >
      sh -c "python -m alembic upgrade head &&
             flask seed-rbac &&
             flask seed-catalog &&
             gunicorn --bind 0.0.0.0:5000 --workers 2 'app:create_app()'"

volumes:
  owner_pg_data:
